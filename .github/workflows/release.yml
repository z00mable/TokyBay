name: Release on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git checkout ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install .NET 10 SDK
        run: |
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV

      - name: Extract version from csproj
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' TokyBay/TokyBay.csproj)
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish win-x64
        run: |
          dotnet publish TokyBay/TokyBay.csproj \
            -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -o publish/win-x64

      - name: Publish linux-x64
        run: |
          dotnet publish TokyBay/TokyBay.csproj \
            -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -o publish/linux-x64

      - name: Publish linux-arm64
        run: |
          dotnet publish TokyBay/TokyBay.csproj \
            -c Release -r linux-arm64 --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -o publish/linux-arm64

      - name: Publish osx-x64
        run: |
          dotnet publish TokyBay/TokyBay.csproj \
            -c Release -r osx-x64 --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -o publish/osx-x64

      - name: Publish osx-arm64
        run: |
          dotnet publish TokyBay/TokyBay.csproj \
            -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -o publish/osx-arm64

      - name: Zip artifacts
        run: |
          cd publish
          zip -j tokybay-win-x64.zip     win-x64/*
          zip -j tokybay-linux-x64.zip   linux-x64/*
          zip -j tokybay-linux-arm64.zip linux-arm64/*
          zip -j tokybay-osx-x64.zip     osx-x64/*
          zip -j tokybay-osx-arm64.zip   osx-arm64/*

      - name: Create and push version tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v${{ steps.version.outputs.value }}"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "v${{ steps.version.outputs.value }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > release_notes.md
          gh release create "v${{ steps.version.outputs.value }}" \
            --title "Release v${{ steps.version.outputs.value }}" \
            --notes-file release_notes.md \
            --latest \
            publish/tokybay-win-x64.zip \
            publish/tokybay-linux-x64.zip \
            publish/tokybay-linux-arm64.zip \
            publish/tokybay-osx-x64.zip \
            publish/tokybay-osx-arm64.zip
